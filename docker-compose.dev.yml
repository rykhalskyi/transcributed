services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcributed
      POSTGRES_USER: transcributed
      POSTGRES_PASSWORD: transcributed
    ports:
      - "5432:5432"
    volumes:
      - transcributed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcributed -d transcributed"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: transcributed
      RABBITMQ_DEFAULT_PASS: transcributed
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - transcributed-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  transcributed-postgres:
  transcributed-rabbitmq:
