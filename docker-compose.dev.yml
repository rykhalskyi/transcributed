services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcributed
      POSTGRES_USER: transcributed
      POSTGRES_PASSWORD: transcributed
    ports:
      - "5432:5432"
    volumes:
      - transcributed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcributed -d transcributed"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: transcributed
      RABBITMQ_DEFAULT_PASS: transcributed
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - transcributed-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./api
      target: api
    profiles: ["app"]
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://transcributed:transcributed@postgres:5432/transcributed
      RABBITMQ_URL: amqp://transcributed:transcributed@rabbitmq:5672/
      NAS_INPUT_ROOT: /nas/lectures
    command: ["sh", "-c", "alembic upgrade head && transcributed"]
    ports:
      - "8000:8000"
    volumes:
      - ${NAS_HOST_PATH:-./api/samples}:/nas/lectures:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./api
      target: worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    profiles: ["worker"]
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://transcributed:transcributed@postgres:5432/transcributed
      RABBITMQ_URL: amqp://transcributed:transcributed@rabbitmq:5672/
      NAS_INPUT_ROOT: /nas/lectures
      WHISPER_MODEL_DIR: /models
      WHISPER_LOCAL_FILES_ONLY: "true"
    volumes:
      - ${NAS_HOST_PATH:-./api/samples}:/nas/lectures:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  transcributed-postgres:
  transcributed-rabbitmq:
