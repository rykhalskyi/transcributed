{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "transcributed.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.urlKey }}: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  {{ .Values.rabbitmq.urlKey }}: {{ required "secrets.rabbitmqUrl is required when secrets.create=true" .Values.secrets.rabbitmqUrl | quote }}
{{- end }}
