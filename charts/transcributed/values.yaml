nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""
  annotations: {}

config:
  logLevel: INFO
  workerBackend: faster-whisper
  whisperDevice: cpu
  whisperComputeType: int8
  whisperModel: small
  whisperLocalFilesOnly: true
  whisperBeamSize: 5
  whisperVadFilter: true
  ffmpegBinary: ffmpeg
  rabbitmqEnabled: true
  rabbitmqExchange: transcription
  rabbitmqJobsQueue: transcription.jobs
  rabbitmqConnectTimeoutSeconds: 5

secrets:
  # Preferred: create a Secret in the homelab repo and leave this false.
  create: false
  name: transcributed-secrets
  databaseUrl: ""
  rabbitmqUrl: ""

database:
  urlKey: DATABASE_URL

rabbitmq:
  urlKey: RABBITMQ_URL

ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rykhalskyi/transcributed-ui
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Upstream used by the bundled nginx proxy. Defaults to the chart's API Service.
  apiUpstream: ""
  # Enable this instead of api.ingress: the UI serves / and proxies /api,
  # /healthz and /readyz to the API, so both ingresses must not share a host.
  ingress:
    enabled: false
    className: traefik
    annotations: {}
    hosts:
      - host: transcributed.homelab.home.arpa
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  replicaCount: 1
  image:
    repository: ghcr.io/rykhalskyi/transcributed-api
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  corsOrigins:
    - http://localhost:5173
  ingress:
    enabled: false
    className: traefik
    annotations: {}
    hosts:
      - host: transcributed.homelab.home.arpa
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  image:
    repository: ghcr.io/rykhalskyi/transcributed-worker
    tag: ""
    pullPolicy: IfNotPresent
  keda:
    enabled: true
    maxReplicaCount: 1
    pollingInterval: 10
    queueLength: "1"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 43200
    ttlSecondsAfterFinished: 900
    terminationGracePeriodSeconds: 120
    restartPolicy: Never
    backoffLimit: 0
  # Sized for multi-hour lectures: a 2h05m file exceeded the previous 4Gi limit.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 12Gi
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources: {}

nas:
  enabled: false
  mountPath: /nas/lectures
  existingClaim: ""
  create: false
  capacity: 10Ti
  accessMode: ReadOnlyMany
  storageClassName: ""
  server: ""
  share: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
