name: Lint and publish chart

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint chart
        run: |
          helm lint charts/transcributed
          helm lint charts/transcributed -f charts/transcributed/ci/values.yaml

      - name: Render and validate manifests
        run: |
          helm template transcributed charts/transcributed \
            -f charts/transcributed/ci/values.yaml > /tmp/manifests.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas < /tmp/manifests.yaml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package and push to GHCR
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/transcributed --destination dist
          helm push dist/transcributed-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
